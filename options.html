<html>
<head>
<style>
select {
	background: buttonface;
    margin-bottom: 2px;
    vertical-align: bottom;
}
input[type="checkbox"] {
	background: buttonface;
    margin-bottom: 2px;
    margin-left: 3px;
    vertical-align: bottom;
}
select option {
	color: black;
}
label{
    vertical-align: top;
}
button#save {
	width: 116px;
	color: #000000;
	font-size: 19px;
	background: buttonface;
	padding: 5px 10px 5px 10px;
}
textarea#blacklist {
    border: #00000069;
    border-style: outset;
    border-width: 1px;
	width: -webkit-fill-available;
	min-height: 3.1ch;
}

div#clrMtrx div {
	width: 52px;
	-webkit-appearance: textfield;
	background-color: white;
	-webkit-rtl-ordering: logical;
	cursor: text;
	padding: 1px;
	border-width: 2px;
	border-style: inset;
	border-color: initial;
	border-image: initial;
	text-rendering: auto;
	color: initial;
	letter-spacing: normal;
	word-spacing: normal;
	text-transform: none;
	text-indent: 0px;
	text-shadow: none;
	display: inline-block;
	text-align: start;
	margin: 0em;
	font: 400 13.3333px Arial;
	-webkit-writing-mode: horizontal-tb !important;
}

div#clrMtrx {
	max-width: 312px;
}
</style>
</head>
<body>

Default maximum speed: <input type="number" id="mxsp" min="1" max="16" step="0.01" value="2.2" style="width: 9ch;"></input><br>
Default step: <input type="number" id="mxst" min="0.01" max="15" step="0.01" value="0.1" style="width: 9ch;"></input><br>
<label for="vsb">Visibility:</label>
<select id="vsb">
  <option>Auto-disappearing</option>
  <option>Always visible</option>
  <option>Always visible when not fullscreen, auto-disappears when fullscreen</option>
</select><br>
Seconds to seek (buttons): <input type="number" id="ska" min="0" step="1" value="10" style="width: 9ch;"></input><br>
% to seek (buttons): <input type="number" id="skp" min="0" step="1" value="4" style="width: 9ch;"></input><br>
<label for="sorp">Seeking preference:</label>
<select id="sorp">
  <option>Prefer seconds</option>
  <option>Prefer %</option>
</select><br>
	<label for="sk_buff">Display buttons to skip to the next buffered range:</label>
	<input type="checkbox" id="sk_buff"></input><br>	
	
	<label for="vfBar">Enable video filter bar:</label>
	<input type="checkbox" id="vfBar"></input><br>
	
	<label for="fMtx">Use custom colour matrix with white balance (initial extension default provides better greens and pinks) (only active if video filter bar is enabled)?:</label>
	<input type="checkbox" id="fMtx"></input><br>
